description: Aurie is a medical device company developing the world’s first automatically reusable no‑touch catheter system. Founded in 2018 in
  Syracuse, New York, Aurie aims to improve independence for individuals requiring intermittent urinary catheterization by reducing infections
  and eliminating the need for disposable catheters. The company has received FDA De Novo clearance and is expanding internationally, targeting
  over 600,000 potential users in the United States.

